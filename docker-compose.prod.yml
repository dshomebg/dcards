# Прод стек. Всичко е именувано по ${APP_SLUG}; портовете са на 127.0.0.1, а nginx на
# хоста (Hestia) проксира dcards-bg.com към ${APP_PORT}. Образът идва като tar от
# deploy скрипта с таг git SHA (INF-2). `.env` на сървъра е в /opt/dcards.
# Миграциите ги пуска scripts/remote/deploy.sh — СЛЕД backup и ПРЕДИ новия код.

name: ${APP_SLUG:-dcards}-prod

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${APP_SLUG:-dcards}-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=bg-BG'
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ${APP_SLUG:-dcards}-redis-prod
    restart: unless-stopped
    # Таван на паметта: при натиск падат първо ключовете с най-кратък TTL (лимити,
    # колички), не сесиите; без него гост-количките могат да запълнят RAM-а.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-ttl
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_SLUG:-dcards}-app-prod:${IMAGE_TAG:-latest}
    container_name: ${APP_SLUG:-dcards}-app-prod
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
    ports:
      - '127.0.0.1:${APP_PORT:-3010}:3000'
    volumes:
      - uploads-data:/app/uploads
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  internal:
    name: ${APP_SLUG:-dcards}-internal-prod

volumes:
  postgres-data:
    name: ${APP_SLUG:-dcards}-postgres-data-prod
  redis-data:
    name: ${APP_SLUG:-dcards}-redis-data-prod
  uploads-data:
    name: ${APP_SLUG:-dcards}-uploads-data-prod
